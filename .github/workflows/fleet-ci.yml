# Fleet standard CI — self-hosted. Honest status on trunk via Actions badge.
# See docs/FLEET_STANDARDS.md (or plans/fractal/P26_FLEET_STANDARDS.md).
#
# TIER LABELS (required): GitHub routes by exact label match. The fleet sizes
# ephemeral workers from job labels before name heuristics (size_for_job).
# Without an explicit tier, a micro worker (0.25c/512MiB, e.g. for gitleaks)
# can pick up cargo check/test and OOM-kill rustc. Pin every job to its tier.
name: fleet-ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: detect stack
    # micro: file probes only (grep Cargo.toml / pyproject). No compile.
    # Measured tier table: micro = 0.25 cpu / 512 MiB.
    runs-on: [self-hosted, linux, x64, podman, micro]
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          set -euo pipefail
          rust=false; python=false
          # Real Rust crate or non-empty workspace members only.
          # Empty virtual workspaces (members = []) must not enable cargo jobs.
          # Ignore comments (e.g. "# Future: members = [\"crates/...\"]").
          if [ -f Cargo.toml ]; then
            if grep -qE '^\[package\]' Cargo.toml; then
              rust=true
            elif grep -vE '^\s*#' Cargo.toml \
              | grep -qE 'members\s*=\s*\[[^]]*["'\''][^"'\'']'; then
              rust=true
            elif find . -path ./target -prune -o -name Cargo.toml -print 2>/dev/null \
              | grep -v '^\./Cargo.toml$' | head -1 | grep -q .; then
              rust=true
            fi
          fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then python=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Detected rust=$rust python=$python"

  rust:
    name: cargo check/test
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    # large: cargo check/test compiles. Measured fleet intent for this job name
    # is tier=large (4 cpu / 8 GiB). Without this label any idle base-label
    # worker (including micro 0.25c/512MiB) can match and OOM rustc.
    # clippy --all-targets measured 1225 MiB (2.4x micro cap) — compile, not lint.
    runs-on: [self-hosted, linux, x64, podman, large]
    steps:
      - uses: actions/checkout@v4
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace

  python:
    name: python lint/test
    needs: detect
    if: needs.detect.outputs.python == 'true'
    # medium: pytest after uv sync installs a dep tree. Measured tier table:
    # medium = 2 cpu / 4 GiB. Pure ruff-only would fit small; install+pytest needs medium.
    runs-on: [self-hosted, linux, x64, podman, medium]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Sync (best-effort)
        run: |
          set -euo pipefail
          if [ -f uv.lock ] || [ -f pyproject.toml ]; then
            uv sync --all-groups 2>/dev/null || uv sync 2>/dev/null || true
          fi
      - name: Ruff (if configured)
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] && grep -q '\[tool.ruff' pyproject.toml 2>/dev/null; then
            uv run ruff check . || python -m ruff check .
          else
            echo "ruff not configured — skip"
          fi
      - name: Pytest (if tests exist)
        run: |
          set -euo pipefail
          if [ -d tests ] || [ -d test ]; then
            uv run pytest -q 2>/dev/null || pytest -q 2>/dev/null || echo "pytest failed or missing — mark job fail" >&2
          else
            echo "no tests/ directory — skip"
          fi

  noop:
    name: no stack detected
    needs: detect
    if: needs.detect.outputs.rust != 'true' && needs.detect.outputs.python != 'true'
    # micro: echo-only advisory path. No compile, no dep install.
    runs-on: [self-hosted, linux, x64, podman, micro]
    steps:
      - run: |
          echo "No Cargo.toml / pyproject detected. fleet-ci reports success with no gates."
          echo "Add stack files or a product-specific CI job for real coverage."
